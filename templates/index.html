<!DOCTYPE html>
<html>
<head>
    <title>AI Prompt App</title>
</head>
<body>
    <h2>Ask the AI</h2>
    <form method="POST">
        <textarea name="prompt" rows="4" cols="60" placeholder="Enter your question here..."></textarea><br>
        <button type="submit">Submit</button>
    </form>
    {% if response %}
        <h3>Response:</h3>
        <pre>{{ response }}</pre>
    {% endif %}
</body>
</html>
